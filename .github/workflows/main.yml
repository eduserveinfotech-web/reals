name: Build Flutter APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.reels.pro .

      - name: Use our AndroidManifest (camera, mic, UPI queries)
        run: |
          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Manifest copied from repo root"
          else
            echo "No AndroidManifest.xml in repo root - keeping the one in android/app/src/main/"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (lists every compile error at once)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reels-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
